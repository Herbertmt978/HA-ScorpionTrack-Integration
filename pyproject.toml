[project]
name = "ha-scorpiontrack-integration"
version = "0.4.0"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
test = [
  "pyscorpiontrack==0.1.2",
  "pytest-homeassistant-custom-component==0.13.354",
]
lint = [
  "ruff==0.16.9",
]

[tool.uv]
package = false
# Keep the local and CI lockfile tooling on the patched 0.13 series.
required-version = ">=0.13.4,<0.14"
prerelease = "allow"
# Keep the HA 2026.8 compatibility fixture while replacing vulnerable
# transitive pins in development/CI only, not HACS installs. Patched aiohttp
# also requires a newer yarl than the historical HA fixture.
override-dependencies = [
  "cryptography==50.0.1",
  "pyjwt==2.15.0",
  "aiohttp==3.14.4",
  "yarl==1.25.1",
  "pillow>=13.0.0",
  "certifi>=2026.10.19",
  "uv>=0.13.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 10
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["custom_components/scorpiontrack_portal"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
required-version = ">=0.15.20"
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PERF", "PIE", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.scorpiontrack_portal"]
