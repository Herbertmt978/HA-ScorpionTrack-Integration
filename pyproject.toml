[project]
name = "ha-scorpiontrack-integration"
version = "0.3.1"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
test = [
  # Keep Home Assistant 2025.1's aiodns cleanup compatible with its test harness.
  "pycares==4.5.0; python_version < '3.14'",
  "pyscorpiontrack==0.1.1",
  "pytest-homeassistant-custom-component==0.13.201; python_version < '3.14'",
  "pytest-homeassistant-custom-component==0.13.346; python_full_version >= '3.14.2'",
]
lint = [
  "ruff==0.15.21",
]

[tool.uv]
package = false
required-version = ">=0.11.2,<0.12"
prerelease = "allow"
environments = [
  "python_full_version < '3.14'",
  "python_full_version >= '3.14.2'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 10
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["custom_components/scorpiontrack"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
required-version = ">=0.15.20"
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PERF", "PIE", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.scorpiontrack"]
