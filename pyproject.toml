[project]
name = "ha-scorpiontrack-integration"
version = "0.3.2"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
test = [
  "pyscorpiontrack==0.1.1",
  "pytest-homeassistant-custom-component==0.13.354",
]
lint = [
  "ruff==0.16.9",
]

[tool.uv]
package = false
# CI retains its explicit uv pin; Dependabot currently uses the 0.12 series.
# Both tool versions are verified against the same locked dependencies.
required-version = ">=0.11.15,<0.13"
prerelease = "allow"
# The HA 2026.8 test fixture pins cryptography 48.0.1, which has known
# certificate-verification vulnerabilities. Keep the HA compatibility baseline
# while testing with the patched dependency; this does not alter HACS installs.
override-dependencies = ["cryptography==50.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 10
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["custom_components/scorpiontrack"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
required-version = ">=0.15.20"
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PERF", "PIE", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.scorpiontrack"]
