name: Python quality

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-version:
    name: Release version guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify manifest, project, lockfile, and tag versions
        run: python scripts/check_release_version.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
          cache-suffix: lint
      - run: uv sync --locked --only-group lint --python 3.14
      - run: uv run --locked --only-group lint ruff check --output-format=github .
      - run: uv run --locked --only-group lint ruff format --check --diff .

  test:
    name: Tests (Home Assistant 2026.8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
          cache-suffix: py3.14
      - name: Install test environment
        run: uv sync --locked --only-group test --python 3.14
      - name: Require full config-flow coverage
        run: >
          uv run --locked --only-group test
          pytest tests/test_config_flow.py
          --cov=custom_components.scorpiontrack.config_flow
          --cov-report=term-missing
          --cov-fail-under=100
      - name: Run complete suite on Home Assistant 2026.8.0
        run: >
          uv run --locked --only-group test
          pytest tests
          --cov=custom_components.scorpiontrack
          --cov-report=term-missing
